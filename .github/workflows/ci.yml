name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  web:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Firestore rules test dependency
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@4.0.1
      - name: Test Firestore security rules with emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-ainca "node --test scripts/firestore-rules.test.mjs"
      - name: Lint (existing codebase baseline)
        run: npm run lint
        continue-on-error: true
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  cloud-functions:
    name: Cloud Functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Compile functions
        run: npm run build
