name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: write

jobs:
  web:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit synchronized npm lockfile on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/inteligencia-seguridad'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push
          fi
      - name: Upload reconciled lockfile for repository maintenance
        uses: actions/upload-artifact@v4
        with:
          name: reconciled-npm-lockfile
          path: package-lock.json
          retention-days: 1
      - name: Lint (existing codebase baseline)
        run: npm run lint
        continue-on-error: true
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  cloud-functions:
    name: Cloud Functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Compile functions
        run: npm run build
